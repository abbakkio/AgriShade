services:
  - type: web
    name: agrishadenet-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./agrishadenet.db
      - key: PYTHON_VERSION
        value: 3.11.9

