services:
  agrishadenet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrishadenet_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/agrishadenet.db
    volumes:
      - agrishadenet_db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agrishadenet_db_data:
    driver: local
